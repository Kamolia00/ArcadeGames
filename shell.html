<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Arcade Games By Kamolia</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
    </style>
</head>

<body>

<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

<script>
    var canvas = document.getElementById('canvas');
    var Module = {
        canvas: canvas
    };

    function clickCanvas() {
        canvas.dispatchEvent(new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            view: window
        }));
    }

    canvas.addEventListener('click', function () {
        canvas.focus();
    });

    window.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.repeat) {
            clickCanvas();
            event.preventDefault();
        }
    });

    window.addEventListener('load', function () {
        canvas.focus();
    });
</script>

{{{ SCRIPT }}}

</body>
</html>
